<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BM CARWASH - Sistem Absensi & Penggajian</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- SheetJS & jsPDF (Exporting) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
      color: var(--text-main);
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      transition: all 0.3s ease;
    }

    .app-container.wide {
      max-width: 1100px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-logo {
      width: 64px;
      height: 64px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      background: #f8fafc;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 36px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #334155;
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    /* Dashboard & Kamera Style */
    .user-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .user-card h3 {
      font-size: 1.1rem;
      color: #0f172a;
    }

    .user-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .camera-box {
      width: 100%;
      height: 260px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #cbd5e1;
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .radius-status {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 6px;
      text-align: center;
    }

    /* Admin Navigation & Tables */
    .admin-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-bar .form-group {
      margin-bottom: 0;
      flex: 1;
      min-width: 140px;
    }

    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- Header -->
    <div class="header">
      <div class="header-logo">🚗</div>
      <h1 id="headerTitle">BM CARWASH</h1>
      <p id="headerSubtitle">Portal Absensi & Penggajian Karyawan</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert hidden"></div>

    <!-- 1. LOGIN VIEW -->
    <div id="loginView">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
          <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary">Masuk</button>
      </form>
    </div>

    <!-- 2. USER DASHBOARD VIEW -->
    <div id="userDashboardView" class="hidden">
      <div class="user-card">
        <h3 id="displayName">-</h3>
        <p id="displayDivisi">-</p>
      </div>

      <div id="menuAbsenSection">
        <button type="button" id="startAbsenBtn" class="btn btn-primary" style="margin-bottom: 12px;">📷 Buka Kamera Absen</button>
        <button type="button" onclick="logout()" class="btn btn-outline">Keluar</button>
      </div>

      <!-- ABSEN FORM SECTION -->
      <div id="absenFormSection" class="hidden">
        <form id="absenForm">
          <!-- Hidden Input untuk Pemanggilan Kamera Bawaan HP Native -->
          <input type="file" id="cameraFileInput" accept="image/*" capture="user" style="display: none;">

          <div class="camera-box">
            <img id="photoPreview" class="preview-img hidden" alt="Preview Selfie">
            <div id="cameraPlaceholder" style="color: #cbd5e1; text-align: center; padding: 20px;">
              <p style="font-size: 2rem;">📷</p>
              <p style="font-size: 0.85rem;">Klik tombol di bawah untuk ambil foto</p>
            </div>
          </div>

          <div class="form-group">
            <button type="button" id="takePhotoBtn" class="btn btn-secondary" style="margin-bottom: 8px;">📷 Ambil Foto Selfie</button>
          </div>

          <div class="form-group">
            <label>Lokasi GPS</label>
            <input type="text" id="gpsInput" class="form-control" readonly placeholder="Mengecek lokasi...">
            <div id="radiusStatus" class="radius-status"></div>
          </div>

          <button type="submit" id="submitAbsenBtn" class="btn btn-primary" style="margin-bottom: 8px;" disabled>Kirim Absensi Kehadiran</button>
          <button type="button" id="cancelAbsenBtn" class="btn btn-outline">Batal</button>
        </form>
      </div>
    </div>

    <!-- 3. ADMIN VIEW -->
    <div id="adminView" class="hidden">
      <div class="admin-nav">
        <button class="tab-btn active" id="tabRekapBtn">📊 Rekap Gaji</button>
        <button class="tab-btn" id="tabLogBtn">📝 Log Absensi</button>
        <button class="tab-btn" id="tabUsersBtn">👥 Kelola User</button>
        <button onclick="logout()" class="btn btn-outline" style="width: auto; margin-left: auto; padding: 6px 12px; font-size: 0.8rem;">Keluar</button>
      </div>

      <!-- Filter Periode (Rekap & Log) -->
      <div class="filter-bar">
        <div class="form-group">
          <label>Dari Tanggal</label>
          <input type="date" id="startDate" class="form-control">
        </div>
        <div class="form-group">
          <label>Sampai Tanggal</label>
          <input type="date" id="endDate" class="form-control">
        </div>
        <button id="refreshBtn" class="btn btn-primary" style="width: auto;">Tampilkan</button>
      </div>

      <!-- Tab 1: Rekap Gaji -->
      <div id="rekapSection">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <button id="exportExcelBtn" class="btn btn-outline" style="width: auto; font-size: 0.8rem;">📥 Export Excel</button>
          <button id="exportPdfBtn" class="btn btn-outline" style="width: auto; font-size: 0.8rem;">📄 Export PDF</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Gaji Pokok</th>
                <th>Rincian Kehadiran</th>
                <th>Total Potongan</th>
                <th>Gaji Akhir</th>
              </tr>
            </thead>
            <tbody id="rekapTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Tab 2: Log Absensi -->
      <div id="logSection" class="hidden">
        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
          <button id="deleteRangeLogBtn" class="btn btn-danger" style="width: auto; font-size: 0.8rem;">🗓️ Hapus Log Periode Ini</button>
          <button id="deleteAllLogBtn" class="btn btn-danger" style="width: auto; font-size: 0.8rem;">🗑️ Hapus Semua Log</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Divisi</th>
                <th>Tipe</th>
                <th>Status</th>
                <th>Waktu</th>
                <th>Hari</th>
                <th>Potongan</th>
                <th>Foto</th>
                <th>GPS</th>
                <th class="action-col">Aksi</th>
              </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Tab 3: Kelola Users -->
      <div id="usersSection" class="hidden">
        <div style="margin-bottom: 12px;">
          <button onclick="openUserModal()" class="btn btn-primary" style="width: auto; font-size: 0.85rem;">➕ Tambah User Baru</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Nama</th>
                <th>Role</th>
                <th>Divisi</th>
                <th>Gaji Pokok</th>
                <th class="action-col">Aksi</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT LOG ABSENSI -->
  <div id="editLogModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;">Edit Log Absensi</h3>
      <input type="hidden" id="editModalRowIndex">
      <div class="form-group">
        <label>Nama Karyawan</label>
        <p id="modalNamaKaryawan" style="font-weight: 600; color: #1e293b;"></p>
      </div>
      <div class="form-group">
        <label>Status Kehadiran</label>
        <select id="modalStatusAbsen" class="form-control">
          <option value="Hadir">Hadir</option>
          <option value="Pulang Cepat">Pulang Cepat</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Alfa">Alfa</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nominal Potongan (Rp)</label>
        <input type="number" id="modalNominalPotongan" class="form-control" placeholder="0">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 20px;">
        <button id="saveEditLogBtn" onclick="submitEditLog()" class="btn btn-primary">Simpan</button>
        <button onclick="closeEditLogModal()" class="btn btn-outline">Batal</button>
      </div>
    </div>
  </div>

  <!-- MODAL USER (TAMBAH/EDIT) -->
  <div id="userModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="userModalTitle" style="margin-bottom: 16px;">Form User</h3>
      <form id="userForm">
        <input type="hidden" id="modalRowIndex">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="modalUsername" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="text" id="modalPassword" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="modalNama" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="modalRole" class="form-control">
            <option value="User">User</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label>Divisi</label>
          <input type="text" id="modalDivisi" class="form-control" placeholder="Contoh: Cuci Mobil">
        </div>
        <div class="form-group">
          <label>Gaji Pokok (Rp)</label>
          <input type="number" id="modalGajiPokok" class="form-control" placeholder="0">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 20px;">
          <button type="submit" id="saveUserBtn" class="btn btn-primary">Simpan</button>
          <button type="button" onclick="closeUserModal()" class="btn btn-outline">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Canvas Tersembunyi untuk Kompresi Gambar -->
  <canvas id="canvas" class="hidden"></canvas>

  <script>
    // ==========================================
    // 1. FUNGSI UTAMA & DEKLARASI VARIABEL
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUNwU45rgFZrC_eUNSucRaLPcWXJUBSRvdjBX1h9wRG9E__M7ay-QqwvvmhnyPyrc/exec";

    // --- PENGATURAN KOORDINAT OUTLET & RADIUS ABSENSI ---
    const OFFICE_LAT = 0.507790;    // Latitude Lokasi Usaha
    const OFFICE_LNG = 122.301510;  // Longitude Lokasi Usaha
    const MAX_RADIUS_METERS = 100;  // Batas radius maksimal dalam meter

    let currentUser = null;
    let photoData = "-";
    let isWithinRadius = false;
    let cachedUsersData = [];
    let hasAbsenToday = false;

    // --- DOM ELEMEN ---
    const appContainer = document.getElementById('appContainer');
    const loginView = document.getElementById('loginView');
    const userDashboardView = document.getElementById('userDashboardView');
    const menuAbsenSection = document.getElementById('menuAbsenSection');
    const absenFormSection = document.getElementById('absenFormSection');
    const adminView = document.getElementById('adminView');
    const alertBox = document.getElementById('alertBox');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');

    const cameraFileInput = document.getElementById('cameraFileInput');
    const takePhotoBtn = document.getElementById('takePhotoBtn');
    const photoPreview = document.getElementById('photoPreview');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const gpsInput = document.getElementById('gpsInput');
    const radiusStatus = document.getElementById('radiusStatus');
    const submitAbsenBtn = document.getElementById('submitAbsenBtn');

    // Tanggal Default (30 hari terakhir hingga hari ini)
    const today = new Date();
    const defaultStart = new Date();
    defaultStart.setDate(today.getDate() - 30);

    const formatDateForInput = (d) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    if (startDateInput) startDateInput.value = formatDateForInput(defaultStart);
    if (endDateInput) endDateInput.value = formatDateForInput(today);

    // Toggle Password Visibility
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (type === 'text') {
          eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 012.122-.363c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411M3 3l18 18" />`;
        } else {
          eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
        }
      });
    }

    function setLoading(isLoading, btnId, text) {
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.disabled = isLoading;
        btn.innerText = text;
      }
    }

    function showAlert(msg, type) {
      if (!alertBox) return;
      if (type === 'hide') {
        alertBox.classList.add('hidden');
        return;
      }
      alertBox.innerText = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove('hidden');
    }

    function lockAbsenFeature(status) {
      hasAbsenToday = status;
      const startAbsenBtn = document.getElementById('startAbsenBtn');

      if (hasAbsenToday) {
        if (startAbsenBtn) {
          startAbsenBtn.disabled = true;
          startAbsenBtn.style.opacity = '0.6';
          startAbsenBtn.style.cursor = 'not-allowed';
          startAbsenBtn.innerText = '🔒 Sudah Absen Hari Ini';
        }
      } else {
        if (startAbsenBtn) {
          startAbsenBtn.disabled = false;
          startAbsenBtn.style.opacity = '1';
          startAbsenBtn.style.cursor = 'pointer';
          startAbsenBtn.innerText = '📷 Buka Kamera Absen';
        }
      }
    }

    // Kalkulasi Jarak Haversine (Meter)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad1 = lat1 * Math.PI / 180;
      const rad2 = lat2 * Math.PI / 180;
      const dRad = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(dRad / 2) * Math.sin(dRad / 2) +
        Math.cos(rad1) * Math.cos(rad2) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return Math.round(R * c);
    }

    async function sendRequest(payload) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error('API Error:', error);
        return { status: 'error', message: error.message || 'Koneksi ke Apps Script gagal.' };
      }

        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.onload = function () {
            // Kompresi Foto via Canvas
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const maxW = 640;
            const scale = maxW / img.width;
            const w = (img.width > maxW) ? maxW : img.width;
            const h = (img.width > maxW) ? img.height * scale : img.height;

            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);

            photoData = canvas.toDataURL('image/jpeg', 0.7);

            if (photoPreview) {
              photoPreview.src = photoData;
              photoPreview.classList.remove('hidden');
            }
            if (cameraPlaceholder) cameraPlaceholder.classList.add('hidden');
            takePhotoBtn.innerText = "🔄 Ambil Ulang Foto";
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function initGPS() {
      if (radiusStatus) {
        radiusStatus.innerText = "Mengecek lokasi...";
        radiusStatus.style.color = "#64748b";
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;
            if (gpsInput) gpsInput.value = `https://maps.google.com/?q=${userLat},${userLng}`;

            const distance = calculateDistance(userLat, userLng, OFFICE_LAT, OFFICE_LNG);

            if (distance <= MAX_RADIUS_METERS) {
              isWithinRadius = true;
              if (radiusStatus) {
                radiusStatus.innerText = `✅ Berada di lokasi usaha (Jarak: ${distance}m)`;
                radiusStatus.style.color = "#10b981";
              }
              if (submitAbsenBtn) submitAbsenBtn.disabled = false;
            } else {
              isWithinRadius = false;
              if (radiusStatus) {
                radiusStatus.innerText = `❌ Di luar radius! Jarak: ${distance}m (Maks: ${MAX_RADIUS_METERS}m)`;
                radiusStatus.style.color = "#ef4444";
              }
              if (submitAbsenBtn) submitAbsenBtn.disabled = true;
            }
          },
          (err) => {
            if (gpsInput) gpsInput.value = "GPS Tidak Diizinkan / Mati";
            if (radiusStatus) {
              radiusStatus.innerText = "⚠️ Aktifkan GPS untuk melakukan absensi.";
              radiusStatus.style.color = "#ef4444";
            }
            if (submitAbsenBtn) submitAbsenBtn.disabled = true;
          },
          { enableHighAccuracy: true }
        );
      } else {
        if (gpsInput) gpsInput.value = "GPS Tidak Didukung";
        if (submitAbsenBtn) submitAbsenBtn.disabled = true;
      }
    }

    function renderRekapTable(rekapData) {
      const tbody = document.getElementById('rekapTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (!rekapData || rekapData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Tidak ada data rekap</td></tr>';
        return;

      rekapData.forEach(item => {
        let statusArr = [];
        if (item.hadir > 0) statusArr.push(`<span style="color:#10b981; font-weight:600;">Hadir: ${item.hadir} Hari</span>`);
        if (item.pulangCepat > 0) statusArr.push(`<span style="color:#f59e0b; font-weight:600;">Pulang Cepat: ${item.pulangCepat} Hari</span>`);
        if (item.izin > 0) statusArr.push(`<span style="color:#3b82f6; font-weight:600;">Izin: ${item.izin} Hari</span>`);
        if (item.sakit > 0) statusArr.push(`<span style="color:#8b5cf6; font-weight:600;">Sakit: ${item.sakit} Hari</span>`);
        if (item.alfa > 0) statusArr.push(`<span style="color:#ef4444; font-weight:600;">Alfa: ${item.alfa} Hari</span>`);

        const statusStr = statusArr.length > 0 ? statusArr.join(' | ') : '-';

        tbody.innerHTML += `
          <tr>
            <td><strong>${item.nama}</strong></td>
            <td>Rp ${formatRupiah(item.gajiPokok)}</td>
            <td>${statusStr}</td>
            <td style="color:#ef4444; font-weight:600;">Rp ${formatRupiah(item.totalPotongan)}</td>
            <td style="color:#10b981; font-weight:700;">Rp ${formatRupiah(item.gajiAkhir)}</td>

      const fields = {

        'modalUsername': user.username,
        'modalPassword': user.password,
        'modalNama': user.nama,
        'modalRole': user.role,
        'modalDivisi': user.divisi,
        'modalGajiPokok': user.gajiPokok

      Object.keys(fields).forEach(id => {

          showAlert('Library SheetJS/XLSX belum terkonfigurasi.', 'error');
          return;
        }
        const isRekap = tabRekapBtn && tabRekapBtn.classList.contains('active');
        const sheetName = isRekap ? "Rekap_Gaji" : "Log_Absensi";
        const tableId = isRekap ? "rekapSection" : "logSection";
        const sVal = startDateInput ? startDateInput.value : '';

        const dateRangeStr = `${sVal}_sd_${eVal}`;

        const targetTable = document.querySelector(`#${tableId} table`);
        if (!targetTable) {
          showAlert('Tabel data tidak ditemukan.', 'error');
          return;
        }

        const table = targetTable.cloneNode(true);
        const actionCols = table.querySelectorAll('.action-col');
        actionCols.forEach(col => col.remove());

        const wb = XLSX.utils.table_to_book(table, { sheet: sheetName });
        XLSX.writeFile(wb, `${sheetName}_${dateRangeStr}.xlsx`);
      });
    }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'a4');
        const isRekap = tabRekapBtn && tabRekapBtn.classList.contains('active');
        const title = isRekap ? "Laporan Rekapitulasi Gaji" : "Laporan Log Absensi";
        const sVal = startDateInput ? startDateInput.value : '';
        const eVal = endDateInput ? endDateInput.value : '';
        const dateRangeStr = `${sVal} s/d ${eVal}`;

        doc.setFontSize(14);
        doc.text(`${title}`, 40, 40);
        doc.setFontSize(10);
        doc.text(`Periode: ${dateRangeStr}`, 40, 55);

        doc.autoTable({
          html: isRekap ? '#rekapSection table' : '#logSection table',
          startY: 70,
          styles: { fontSize: 8 },
          columns: isRekap ? undefined : [0, 1, 2, 3, 4, 5, 6, 7, 8]
        });

        doc.save(`${title}_${sVal}_sd_${eVal}.pdf`);
      });
    }

    function logout() {
      currentUser = null;
      photoData = "-";
      isWithinRadius = false;
      resetFotoState();

      if (appContainer) appContainer.classList.remove('wide');
      if (adminView) adminView.classList.add('hidden');
      if (userDashboardView) userDashboardView.classList.add('hidden');
      if (absenFormSection) absenFormSection.classList.add('hidden');
      if (menuAbsenSection) menuAbsenSection.classList.remove('hidden');
      if (loginView) loginView.classList.remove('hidden');

      const lForm = document.getElementById('loginForm');
      if (lForm) lForm.reset();

      showAlert('', 'hide');
      const hTitle = document.getElementById('headerTitle');
      const hSub = document.getElementById('headerSubtitle');
      if (hTitle) hTitle.innerText = "BM CARWASH";
      if (hSub) hSub.innerText = "Portal Absensi & Penggajian Karyawan";

      const pwdInput = document.getElementById('password');
      const eye = document.getElementById('eyeIcon');
      if (pwdInput) pwdInput.setAttribute('type', 'password');
      if (eye) {
        eye.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      }
    }

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID').format(angka || 0);
    }
  </script>
</body>
