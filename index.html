<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Karyawan BM Carwash</title>
    <!-- Library Eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --bg-color: #f8fafc;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 480px; transition: all 0.3s ease; }
        .container.wide { max-width: 1100px; }
        .hidden { display: none !important; }
        h2, h3 { color: #1e293b; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        
        .btn { width: 100%; padding: 12px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #334155; }
        
        .alert { padding: 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 16px; text-align: center; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        
        /* Area Preview Foto */
        .preview-box { width: 100%; height: 260px; background: #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; border: 2px dashed #cbd5e1; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Table & Layout */
        .table-container { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #f1f5f9; font-weight: 600; }
        .tabs { display: flex; gap: 8px; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
        .tab-btn { padding: 8px 16px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 600; color: #64748b; }
        .tab-btn.active { border-color: var(--primary-color); color: var(--primary-color); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 24px; border-radius: 8px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <h2 id="headerTitle">BM CARWASH</h2>
    <p id="headerSubtitle" class="subtitle">Portal Absensi Karyawan</p>

    <div id="alertBox" class="alert hidden"></div>

    <!-- 1. LOGIN VIEW -->
    <div id="loginView">
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
                <button type="button" id="togglePasswordBtn" style="position: absolute; right: 10px; top: 32px; background: none; border: none; cursor: pointer;">
                    <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary">Masuk</button>
        </form>
    </div>

    <!-- 2. USER DASHBOARD VIEW -->
    <div id="userDashboardView" class="hidden">
        <div style="background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 16px;">
            <p><strong>Nama:</strong> <span id="displayName">-</span></p>
            <p><strong>Divisi:</strong> <span id="displayDivisi">-</span></p>
        </div>

        <div id="menuAbsenSection">
            <button id="startAbsenBtn" class="btn btn-primary">📷 Absen Kehadiran</button>
            <button onclick="logout()" class="btn btn-outline">Keluar</button>
        </div>

        <div id="absenFormSection" class="hidden">
            <form id="absenForm">
                <!-- Area Pratinjau Foto -->
                <div class="preview-box">
                    <img id="photoPreview" class="hidden" src="" alt="Pratinjau Foto">
                    <p id="photoPlaceholder" style="color: #64748b; font-size: 0.9rem;">Belum ada foto diambil</p>
                </div>

                <!-- Input Kamera HP (Panggil Kamera Asli Smartphone) -->
                <input type="file" id="nativeCameraInput" accept="image/*" capture="user" class="hidden">
                
                <button type="button" id="openCameraBtn" class="btn btn-primary">📸 Ambil Foto Selfie</button>

                <p id="radiusStatus" style="font-size: 0.85rem; font-weight: 600; margin: 12px 0; text-align: center;"></p>
                <input type="hidden" id="gpsLocation">

                <button type="submit" id="submitAbsenBtn" class="btn btn-primary" disabled>Kirim Absensi Kehadiran</button>
                <button type="button" id="cancelAbsenBtn" class="btn btn-outline">Batal</button>
            </form>
        </div>
    </div>

    <!-- 3. ADMIN DASHBOARD VIEW -->
    <div id="adminView" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="date" id="startDate" style="width: auto;">
                <span>s/d</span>
                <input type="date" id="endDate" style="width: auto;">
                <button id="refreshBtn" class="btn btn-primary" style="width: auto; margin-top: 0;">Tampilkan</button>
            </div>
            <div>
                <button id="exportExcelBtn" class="btn btn-secondary" style="width: auto; margin-top: 0;">📊 Excel</button>
                <button id="exportPdfBtn" class="btn btn-secondary" style="width: auto; margin-top: 0;">📄 PDF</button>
                <button onclick="logout()" class="btn btn-outline" style="width: auto; margin-top: 0;">Keluar</button>
            </div>
        </div>

        <div class="tabs">
            <button id="tabRekapBtn" class="tab-btn active">Rekap Gaji</button>
            <button id="tabLogBtn" class="tab-btn">Log Absensi</button>
            <button id="tabUsersBtn" class="tab-btn">Kelola Karyawan</button>
        </div>

        <div id="rekapSection">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Gaji Pokok</th>
                            <th>Rincian Kehadiran</th>
                            <th>Total Potongan</th>
                            <th>Gaji Akhir</th>
                        </tr>
                    </thead>
                    <tbody id="rekapTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="logSection" class="hidden">
            <div style="margin-bottom: 8px; display: flex; gap: 8px;">
                <button id="deleteRangeLogBtn" class="btn btn-danger" style="width: auto;">🗓️ Hapus Log Periode Ini</button>
                <button id="deleteAllLogBtn" class="btn btn-danger" style="width: auto;">🗑️ Hapus Semua Log</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Divisi</th>
                            <th>Tipe</th>
                            <th>Status</th>
                            <th>Waktu</th>
                            <th>Hari</th>
                            <th>Potongan</th>
                            <th>Foto</th>
                            <th>GPS</th>
                            <th class="action-col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="usersSection" class="hidden">
            <button onclick="openUserModal()" class="btn btn-primary" style="width: auto; margin-bottom: 12px;">➕ Tambah Karyawan Baru</button>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Nama</th>
                            <th>Role</th>
                            <th>Divisi</th>
                            <th>Gaji Pokok</th>
                            <th class="action-col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODALS -->
<div id="editLogModal" class="modal hidden">
    <div class="modal-content">
        <h3>Edit Data Absensi</h3>
        <p style="margin-bottom: 12px;">Karyawan: <strong id="modalNamaKaryawan"></strong></p>
        <input type="hidden" id="editModalRowIndex">
        <div class="form-group">
            <label>Status Absen</label>
            <select id="modalStatusAbsen">
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Pulang Cepat">Pulang Cepat</option>
                <option value="Alfa">Alfa</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nominal Potongan (Rp)</label>
            <input type="number" id="modalNominalPotongan" min="0">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button id="saveEditLogBtn" onclick="submitEditLog()" class="btn btn-primary">Simpan</button>
            <button onclick="closeEditLogModal()" class="btn btn-outline">Batal</button>
        </div>
    </div>
</div>

<div id="userModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="userModalTitle">Tambah User</h3>
        <form id="userForm">
            <input type="hidden" id="modalRowIndex">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="modalUsername" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="text" id="modalPassword" required>
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="modalNama" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="modalRole">
                    <option value="User">User</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label>Divisi</label>
                <input type="text" id="modalDivisi">
            </div>
            <div class="form-group">
                <label>Gaji Pokok (Rp)</label>
                <input type="number" id="modalGajiPokok" min="0">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button type="submit" id="saveUserBtn" class="btn btn-primary">Simpan</button>
                <button type="button" onclick="closeUserModal()" class="btn btn-outline">Batal</button>
            </div>
        </form>
    </div>
</div>

<script>
// ==========================================
// KONFIGURASI UTAMA
// ==========================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUNwU45rgFZrC_eUNSucRaLPcWXJUBSRvdjBX1h9wRG9E__M7ay-QqwvvmhnyPyrc/exec";
const OFFICE_LAT = 0.507790;
const OFFICE_LNG = 122.301510;
const MAX_RADIUS_METERS = 100;

let currentUser = null;
let photoData = "-";
let isWithinRadius = false;
let cachedUsersData = [];
let hasAbsenToday = false;

// DOM Elements
const appContainer = document.getElementById('appContainer');
const loginView = document.getElementById('loginView');
const userDashboardView = document.getElementById('userDashboardView');
const menuAbsenSection = document.getElementById('menuAbsenSection');
const absenFormSection = document.getElementById('absenFormSection');
const adminView = document.getElementById('adminView');

const openCameraBtn = document.getElementById('openCameraBtn');
const nativeCameraInput = document.getElementById('nativeCameraInput');
const photoPreview = document.getElementById('photoPreview');
const photoPlaceholder = document.getElementById('photoPlaceholder');

const gpsInput = document.getElementById('gpsLocation');
const radiusStatus = document.getElementById('radiusStatus');
const submitAbsenBtn = document.getElementById('submitAbsenBtn');

// Helper Functions
function setLoading(isLoading, btnId, text) {
    const btn = document.getElementById(btnId);
    if (btn) {
        btn.disabled = isLoading;
        btn.innerText = text;
    }
}

function showAlert(msg, type) {
    const alertBox = document.getElementById('alertBox');
    if (!alertBox) return;
    if (type === 'hide') {
        alertBox.classList.add('hidden');
        return;
    }
    alertBox.innerText = msg;
    alertBox.className = `alert alert-${type}`;
    alertBox.classList.remove('hidden');
}

function formatRupiah(angka) {
    return new Intl.NumberFormat('id-ID').format(angka || 0);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const rad1 = lat1 * Math.PI / 180;
    const rad2 = lat2 * Math.PI / 180;
    const dRad = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dRad / 2) * Math.sin(dRad / 2) + Math.cos(rad1) * Math.cos(rad2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))));
}

async function sendRequest(payload) {
    try {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        return await response.json();
    } catch (error) {
        return { status: 'error', message: 'Koneksi ke Apps Script gagal.' };
    }
}

// ==========================================
// LOGIKA KAMERA HP BAWAAN
// ==========================================
openCameraBtn.addEventListener('click', () => {
    nativeCameraInput.click(); // Buka aplikasi kamera bawaan HP
});

nativeCameraInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            // Kompresi sederhana menggunakan canvas
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxWidth = 640;
                const scale = maxWidth / img.width;
                
                canvas.width = maxWidth;
                canvas.height = img.height * scale;
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                photoData = canvas.toDataURL('image/jpeg', 0.6); // Simpan hasil gambar

                // Tampilkan Preview
                photoPreview.src = photoData;
                photoPreview.classList.remove('hidden');
                photoPlaceholder.classList.add('hidden');
                
                openCameraBtn.innerText = "🔄 Foto Ulang";
                checkFormValidity();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
});

function checkFormValidity() {
    if (isWithinRadius && photoData !== "-") {
        submitAbsenBtn.disabled = false;
    } else {
        submitAbsenBtn.disabled = true;
    }
}

// ==========================================
// GEOLOKASI & ABSENSI
// ==========================================
function initGPS() {
    radiusStatus.innerText = "Mengecek lokasi GPS...";
    radiusStatus.style.color = "#64748b";

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const userLat = pos.coords.latitude;
                const userLng = pos.coords.longitude;
                gpsInput.value = `https://maps.google.com/?q=${userLat},${userLng}`;

                const distance = calculateDistance(userLat, userLng, OFFICE_LAT, OFFICE_LNG);

                if (distance <= MAX_RADIUS_METERS) {
                    isWithinRadius = true;
                    radiusStatus.innerText = `✅ Berada di lokasi usaha (Jarak: ${distance}m)`;
                    radiusStatus.style.color = "#10b981";
                } else {
                    isWithinRadius = false;
                    radiusStatus.innerText = `❌ Di luar radius! Jarak: ${distance}m (Maks: ${MAX_RADIUS_METERS}m)`;
                    radiusStatus.style.color = "#ef4444";
                }
                checkFormValidity();
            },
            () => {
                radiusStatus.innerText = "⚠️ Aktifkan GPS untuk absensi.";
                radiusStatus.style.color = "#ef4444";
                submitAbsenBtn.disabled = true;
            },
            { enableHighAccuracy: true }
        );
    }
}

// Handlers UI Absensi
document.getElementById('startAbsenBtn').addEventListener('click', () => {
    if (hasAbsenToday) {
        showAlert('Anda sudah melakukan absensi hari ini.', 'error');
        return;
    }
    menuAbsenSection.classList.add('hidden');
    absenFormSection.classList.remove('hidden');
    initGPS();
});

document.getElementById('cancelAbsenBtn').addEventListener('click', () => {
    absenFormSection.classList.add('hidden');
    menuAbsenSection.classList.remove('hidden');
    photoData = "-";
    photoPreview.classList.add('hidden');
    photoPlaceholder.classList.remove('hidden');
    openCameraBtn.innerText = "📸 Ambil Foto Selfie";
    showAlert('', 'hide');
});

// Submit Form Absen
document.getElementById('absenForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!isWithinRadius) return showAlert("Anda berada di luar radius!", "error");
    if (photoData === "-") return showAlert("Silakan ambil foto terlebih dahulu!", "error");

    setLoading(true, 'submitAbsenBtn', 'Mengirim...');

    const res = await sendRequest({
        action: 'absen',
        nama: currentUser ? currentUser.nama : '',
        divisi: currentUser ? currentUser.divisi : '',
        gajiPokok: currentUser ? currentUser.gajiPokok : 0,
        tipe: 'Masuk',
        status: 'Hadir',
        potongan: 0,
        foto: photoData,
        gps: gpsInput.value
    });

    if (res.status === 'success') {
        showAlert(res.message, 'success');
        hasAbsenToday = true;
        setTimeout(() => {
            absenFormSection.classList.add('hidden');
            menuAbsenSection.classList.remove('hidden');
            document.getElementById('startAbsenBtn').disabled = true;
            document.getElementById('startAbsenBtn').innerText = "🔒 Sudah Absen Hari Ini";
        }, 1500);
    } else {
        showAlert(res.message, 'error');
    }
    setLoading(false, 'submitAbsenBtn', 'Kirim Absensi Kehadiran');
});

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    setLoading(true, 'loginBtn', 'Proses Login...');

    const res = await sendRequest({
        action: 'login',
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
    });

    if (res.status === 'success') {
        currentUser = res.user;
        loginView.classList.add('hidden');
        showAlert('', 'hide');

        if (String(currentUser.role).toLowerCase() === 'admin') {
            appContainer.classList.add('wide');
            adminView.classList.remove('hidden');
            loadAdminData();
        } else {
            document.getElementById('displayName').innerText = currentUser.nama || '-';
            document.getElementById('displayDivisi').innerText = currentUser.divisi || '-';
            userDashboardView.classList.remove('hidden');
            
            if (res.hasAbsenToday) {
                hasAbsenToday = true;
                const btn = document.getElementById('startAbsenBtn');
                btn.disabled = true;
                btn.innerText = "🔒 Sudah Absen Hari Ini";
            }
        }
    } else {
        showAlert(res.message, 'error');
    }
    setLoading(false, 'loginBtn', 'Masuk');
});

function logout() {
    currentUser = null;
    photoData = "-";
    appContainer.classList.remove('wide');
    adminView.classList.add('hidden');
    userDashboardView.classList.add('hidden');
    absenFormSection.classList.add('hidden');
    menuAbsenSection.classList.remove('hidden');
    loginView.classList.remove('hidden');
    document.getElementById('loginForm').reset();
    showAlert('', 'hide');
}
</script>
</body>
</html>
